name: CI - Java Goat Listing

on:
  push:
    paths:
      - "backend/goat_listing/**"
  pull_request:
    paths:
      - "backend/goat_listing/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    defaults:
      run:
        working-directory: backend/goat_listing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

      - name: Build with Maven
        run: mvn -B -DskipTests package

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/goat/goat-listing:${{ github.sha }}

      - name: Upload image tag to workflow
        run: echo "IMAGE_TAG=ghcr.io/${{ github.repository_owner }}/goat-listing:${{ github.sha }}" >> $GITHUB_ENV