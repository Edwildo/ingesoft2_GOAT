spring:
  application:
    name: goat-listing-service
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none  # 'none' evita validación estricta de tipos ENUM personalizados
    show-sql: false  # Cambiar a 'true' para ver las queries SQL
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: identity
        format_sql: true
        # Escapar identificadores (necesario porque "order" es palabra reservada en PostgreSQL)
        globally_quoted_identifiers: true
        globally_quoted_identifiers_strategy: standard
        # Configurar Hibernate para manejar ENUMs de PostgreSQL correctamente
        type.prefer_native_enum_types: true
        # Configurar el mapeo de ENUMs con schema
        type.default_for_enum: true

jwt:
  secret: ${JWT_SECRET:defaultSecretKeyThatShouldBeChangedInProductionEnvironmentMin32Characters}
  expiration: ${JWT_EXPIRATION:86400000}

services:
  python:
    base-url: ${PYTHON_SERVICE_URL:http://localhost:8082}

server:
  port: 8081

